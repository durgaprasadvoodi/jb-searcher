name: Daily Job Scrape

on:
  schedule:
    # Runs at 03:00 UTC = 8:30 AM IST daily. Adjust as needed.
    -cron: '0 */6 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit updated data back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python3 scraper.py --pages 2

      - name: Commit updated job data
        run: |
          git config user.name "job-scraper-bot"
          git config user.email "actions@github.com"
          git add docs/data/jobs.json
          git diff --quiet --cached || git commit -m "Update job data $(date +'%Y-%m-%d')"
          git push
